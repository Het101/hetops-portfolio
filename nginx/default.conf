# hetops.dev behind Traefik (TLS ends there). Static files only.
server {
    # Both stacks: inside Alpine, localhost resolves to ::1 first, so an IPv4-only listener fails
    # the container healthcheck and Traefik routes nothing (this took the site down once).
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    # Behind a proxy, redirects must be relative or nginx sends visitors to http://host:80/.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain application/xml;

    # Pages: always revalidate, so a deploy shows up on the next load.
    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Scripts and styles keep their names across deploys, so the cache stays short.
    location ~* \.(?:css|js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location ~* \.(?:png|webp|jpg|svg|ico|pdf|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location = /.well-known/security.txt {
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
