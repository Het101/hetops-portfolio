# Included in every location: nginx drops server-level add_header lines in any block that adds its own.
# The script-src hash is the inline import map in index.html; CI recomputes it and fails if they drift.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-QXQFgRIBq+7pHN2ajO/I7naej6lpf+WvG+hDIuxM0xY=' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://analytics.hetops.dev https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://dns.hetops.dev https://drill.hetops.dev https://api.npmjs.org https://api.github.com https://github-contributions-api.jogruber.de https://analytics.hetops.dev https://cdn.jsdelivr.net https://lab.hetops.dev https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
